name: CI

# Corre en cada push a main y en cada rama con Pull Request abierto.
# Vercel ya corre `next build` al deployar, asi que los errores de tipos y de
# compilacion ya estaban cubiertos. Lo que agrega este workflow es lo que el
# build NO mira: accesibilidad, contraste, imagenes sobredimensionadas y
# enlaces o anclas rotas.
on:
  push:
    branches: [main]
  pull_request:

# Si se pushea dos veces seguidas, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Enlaces y Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Un solo comando, el mismo que se corre a mano: compila en una carpeta
      # aparte, levanta el sitio en su propio puerto, revisa enlaces y anclas y
      # corre Lighthouse. Que sea el mismo evita que CI y el trabajo local se
      # separen y que un fallo aparezca recien aca.
      - name: Compilar y verificar
        run: npm run verify:lh

      # Se sube siempre, tambien cuando falla: el informe es justamente lo
      # que hace falta leer para entender por que fallo.
      - name: Guardar informe de Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14
          if-no-files-found: ignore
